<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" class="iterative-svg" role="img" aria-label="Countdown: accuracy versus total model–prompt evaluations" aria-describedby="iterative-countdown-desc">
    <desc id="iterative-countdown-desc">1500 test examples. Points show mean accuracy over three seeds. The horizontal axis is linear in total model–prompt evaluations: one model generating and scoring one prompt. Main-run totals include search, checkpoint selection, and final evaluation, following Appendix D.2. MN-RandOpt is shown at N=100, K=25; N=3000, K=25; and N=3000, K=1. Iterative methods and the MN K=1 control return single models. Missing scores are omitted, not plotted as zero.</desc>
    <style>.iterative-svg{font-family:Inter,Arial,Helvetica,sans-serif;background:#fff}.iterative-axes text{font-size:12px;fill:#7b818b}.iterative-callout{font-size:18px;font-weight:600;fill:#306FAD}.iterative-comparison{font-size:11.8px;fill:#687383}.iterative-small-n{font-size:12px;fill:#306FAD;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.iterative-point[role=button]{cursor:pointer}.iterative-point:focus{outline:none}.iterative-point:focus .iterative-hit{stroke:#303030;stroke-width:1}.iterative-series{transition:opacity .15s ease}</style>
    <g class="figure2-row" data-row="countdown" transform="translate(80 76)"><g class="f2-panel" style="--panel-delay:0ms">
      <g class="f2-axes iterative-axes"><text class="iterative-y-label" x="-58" y="143" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 -58 143)">Accuracy (%)</text><path d="M0 286H430" fill="none" stroke="#e5e7eb"/><text x="-13" y="290" text-anchor="end">10%</text><path d="M0 204.2857H430" fill="none" stroke="#e5e7eb"/><text x="-13" y="208.2857" text-anchor="end">20%</text><path d="M0 122.5714H430" fill="none" stroke="#e5e7eb"/><text x="-13" y="126.5714" text-anchor="end">30%</text><path d="M0 40.8571H430" fill="none" stroke="#e5e7eb"/><text x="-13" y="44.8571" text-anchor="end">40%</text><path d="M0 0V286H430" fill="none" stroke="#d0d3d8"/><path d="M0 286v5" stroke="#d0d3d8"/><text x="0" y="312" text-anchor="middle">0</text><path d="M126.4706 286v5" stroke="#d0d3d8"/><text x="126.4706" y="312" text-anchor="middle">200k</text><path d="M252.9412 286v5" stroke="#d0d3d8"/><text x="252.9412" y="312" text-anchor="middle">400k</text><path d="M379.4118 286v5" stroke="#d0d3d8"/><text x="379.4118" y="312" text-anchor="middle">600k</text></g><g class="f2-data"><g class="iterative-series" data-iterative-series="modular_single"><g class="iterative-point f2-point" ><title>MN-RandOpt · K=1, Countdown: 16.18 ± 1.08 percent; 601,500 total model–prompt evaluations; N=3000, K=1.</title><polygon points="380.3603,228.5006 382.1707,233.0088 387.0177,233.3375 383.2896,236.4524 384.4748,241.1637 380.3603,238.5806 376.2458,241.1637 377.431,236.4524 373.7029,233.3375 378.5499,233.0088" fill="#fff" class="iterative-marker" stroke="#91979E" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="mezo"><g class="iterative-point f2-point" ><title>MeZO, Countdown: 29.22 ± 1.93 percent; 609,500 total model–prompt evaluations; N=3000, K=1.</title><rect x="380.4191" y="123.9451" width="10" height="10" fill="#AE6262" class="iterative-marker" stroke="#AE6262" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="zo"><g class="iterative-point f2-point" ><title>ZO-Finetuner, Countdown: 29.56 ± 0.82 percent; 609,500 total model–prompt evaluations; N=3000, K=1.</title><path d="M385.4191 119.1669L391.4191 131.1669H379.4191Z" fill="#9069B2" class="iterative-marker" stroke="#9069B2" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="es"><g class="iterative-point f2-point" ><title>ES-at-Scale, Countdown: 35.67 ± 5.08 percent; 601,500 total model–prompt evaluations; N=3000, K=1.</title><path d="M380.3603 70.2394L386.3603 76.2394L380.3603 82.2394L374.3603 76.2394Z" fill="#66866B" class="iterative-marker" stroke="#66866B" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="randopt"><g class="iterative-point f2-point" ><title>RandOpt · K=25, Countdown: 35.29 ± 1.60 percent; 637,500 total model–prompt evaluations; N=3000, K=25.</title><circle cx="403.125" cy="79.3446" r="5" fill="#fff" class="iterative-marker" stroke="#C76526" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="modular"><g class="iterative-point f2-point" ><title>MN-RandOpt · K=25, Countdown: 38.40 ± 2.71 percent; 57,500 total model–prompt evaluations; N=100, K=25.</title><polygon points="36.3603,46.9314 38.1707,51.4396 43.0177,51.7683 39.2896,54.8832 40.4748,59.5945 36.3603,57.0114 32.2458,59.5945 33.431,54.8832 29.7029,51.7683 34.5499,51.4396" fill="#306FAD" class="iterative-marker" stroke="#306FAD" stroke-width="1.8"/></g><g class="iterative-point f2-point" ><title>MN-RandOpt · K=25, Countdown: 38.44 ± 1.20 percent; 637,500 total model–prompt evaluations; N=3000, K=25.</title><polygon points="403.125,46.6046 404.9354,51.1128 409.7824,51.4415 406.0543,54.5564 407.2395,59.2677 403.125,56.6846 399.0105,59.2677 400.1957,54.5564 396.4676,51.4415 401.3146,51.1128" fill="#306FAD" class="iterative-marker" stroke="#306FAD" stroke-width="1.8"/></g></g></g><g class="f2-emphasis" pointer-events="none"><text class="iterative-callout" x="0" y="-50">38.40% at 57,500 evals</text><text class="iterative-comparison" x="0" y="-28">10.46× fewer evals vs ES-at-Scale · +2.73 pp</text><text class="iterative-small-n" x="53.3603" y="41.9314">N=100</text><circle cx="36.3603" cy="53.9314" r="11" fill="none" stroke="#306FAD" stroke-width="1"/></g>
    </g></g>
  </svg>