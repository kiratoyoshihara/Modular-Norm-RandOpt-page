<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" class="iterative-svg" role="img" aria-label="Countdown: accuracy versus N" aria-describedby="iterative-countdown-desc">
    <desc id="iterative-countdown-desc">1500 test examples. Points show mean accuracy over three seeds. The horizontal axis is linear in N: sampled candidates for RandOpt methods, perturbations for iterative baselines. MN-RandOpt is shown at N=100, K=25; N=3000, K=25; and N=3000, K=1. Iterative methods and the MN K=1 control return single models. Missing scores are omitted, not plotted as zero.</desc>
    <style>.iterative-svg{font-family:Inter,Arial,Helvetica,sans-serif;background:#fff}.iterative-axes text{font-size:12px;fill:#7b818b}.iterative-callout{font-size:18px;font-weight:600;fill:#306FAD}.iterative-comparison{font-size:11.8px;fill:#687383}.iterative-small-n{font-size:12px;fill:#306FAD;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.iterative-point[role=button]{cursor:pointer}.iterative-point:focus{outline:none}.iterative-point:focus .iterative-hit{stroke:#303030;stroke-width:1}.iterative-series{transition:opacity .15s ease}</style>
    <g class="figure2-row" data-row="countdown" transform="translate(80 76)"><g class="f2-panel" style="--panel-delay:0ms">
