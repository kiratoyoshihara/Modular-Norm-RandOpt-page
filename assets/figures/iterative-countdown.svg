<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 374" class="iterative-svg" role="img" aria-labelledby="iterative-countdown-title iterative-countdown-desc">
    <title id="iterative-countdown-title">Countdown: accuracy versus main-run evaluation budget</title>
    <desc id="iterative-countdown-desc">1500 test examples. Means and sample standard deviations over three seeds. MN RandOpt K=25 has three measured settings connected as a visual guide. Iterative methods and the MN K=1 control return single models. Unreported scores are omitted, not plotted as zero.</desc>
    <style>.iterative-svg{font-family:Inter,Arial,Helvetica,sans-serif;background:#fff}.iterative-axes text{font-size:12px;fill:#7b818b}.iterative-point[role=button]{cursor:pointer}.iterative-point:focus{outline:none}.iterative-point:focus .iterative-hit{stroke:#303030;stroke-width:1}.iterative-series{transition:opacity .15s ease}</style>
    <defs><clipPath id="iterative-countdown-reveal"><rect class="f2-sweep" x="-12" y="-12" width="482" height="310" style="transform-origin:-12px 0px"/></clipPath></defs>
