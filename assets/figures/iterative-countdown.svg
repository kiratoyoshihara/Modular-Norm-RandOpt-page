; 601,500 main-run model-prompt evaluations; N=2820, K=25.</title><circle cx="393.5529" cy="48.2931" r="5" fill="#306FAD" stroke="#306FAD" stroke-width="1.8"/></g><g class="iterative-point" ><title>MN RandOpt · K=25, Countdown: 38.44 ± 1.20 percent; 637,500 main-run model-prompt evaluations; N=3000, K=25.</title><circle cx="417.1071" cy="53.6046" r="5" fill="#306FAD" stroke="#306FAD" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="es"><path class="iterative-error" d="M393.5529 34.7286V117.7503M389.5529 34.7286H397.5529M389.5529 117.7503H397.5529" fill="none" stroke="#66866B" stroke-width="1.2" opacity=".55"/><g class="iterative-point" ><title>Iterative ES, Countdown: 35.67 ± 5.08 percent; 601,500 main-run model-prompt evaluations; N=3000, K=1.</title><path d="M393.5529 70.2394L399.5529 76.2394L393.5529 82.2394L387.5529 76.2394Z" fill="#66866B" stroke="#66866B" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="zo"><path class="iterative-error" d="M398.7871 119.4663V132.8674M394.7871 119.4663H402.7871M394.7871 132.8674H402.7871" fill="none" stroke="#9069B2" stroke-width="1.2" opacity=".55"/><g class="iterative-point" ><title>ZO-Finetuner, Countdown: 29.56 ± 0.82 percent; 609,500 main-run model-prompt evaluations; N=3000, K=1.</title><path d="M398.7871 119.1669L404.7871 131.1669H392.7871Z" fill="#9069B2" stroke="#9069B2" stroke-width="1.8"/></g></g><g class="iterative-series" data-iterative-series="modular_single"><path class="iterative-error" d="M393.5529 226.6754V244.3257M389.5529 226.6754H397.5529M389.5529 244.3257H397.5529" fill="none" stroke="#91979E" stroke-width="1.2" opacity=".55"/><g class="iterative-point" ><title>MN RandOpt · K=1, Countdown: 16.18 ± 1.08 percent; 601,500 main-run model-prompt evaluations; N=3000, K=1.</title><circle cx="393.5529" cy="235.5006" r="5" fill="#fff" stroke="#91979E" stroke-width="1.8"/></g></g></g></g></g>
