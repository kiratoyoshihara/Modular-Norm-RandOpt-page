    <desc id="radar-desc">Three methods at N=100 and K=25. All tasks and model sizes share a 0–100% axis, with guidelines at 20, 40, 60, 80, and 100. Area is not an aggregate score. The tooltip gives the mean difference between Modular Norm RandOpt and RandOpt, in percentage points. Lines show means over three seeds. Each task uses its own selected ensemble.</desc>
